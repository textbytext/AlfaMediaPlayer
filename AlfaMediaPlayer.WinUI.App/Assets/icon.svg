<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Иконка медиаплеера — кадр киноленты и музыкальная нота</title>
  <defs>
    <linearGradient id="background" x1="48" y1="16" x2="464" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B69"/>
      <stop offset="1" stop-color="#0C1428"/>
    </linearGradient>
    <linearGradient id="film" x1="80" y1="112" x2="432" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78E4FF"/>
      <stop offset="1" stop-color="#4584FF"/>
    </linearGradient>
    <linearGradient id="note" x1="204" y1="161" x2="312" y2="353" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6F3FF"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#background)"/>
  <rect x="9" y="9" width="494" height="494" rx="111" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>
  <!-- A single film frame, with clearly separated sprocket holes. -->
  <rect x="72" y="112" width="368" height="288" rx="32" fill="#070E20" fill-opacity=".3"/>
  <rect x="72" y="104" width="368" height="288" rx="32" fill="url(#film)"/>
  <rect x="126" y="128" width="260" height="240" rx="16" fill="#142440"/>
  <g fill="#142440">
    <rect x="88" y="130" width="22" height="30" rx="5"/>
    <rect x="88" y="184" width="22" height="30" rx="5"/>
    <rect x="88" y="238" width="22" height="30" rx="5"/>
    <rect x="88" y="292" width="22" height="30" rx="5"/>
    <rect x="88" y="346" width="22" height="22" rx="5"/>
    <rect x="402" y="130" width="22" height="30" rx="5"/>
    <rect x="402" y="184" width="22" height="30" rx="5"/>
    <rect x="402" y="238" width="22" height="30" rx="5"/>
    <rect x="402" y="292" width="22" height="30" rx="5"/>
    <rect x="402" y="346" width="22" height="22" rx="5"/>
  </g>
  <!-- The note sits inside the film frame: one combined audio/video symbol. -->
  <path d="M266 307V177L326 164V204L286 213V307" stroke="#050C1C" stroke-opacity=".3" stroke-width="27" stroke-linejoin="round" transform="translate(0 7)"/>
  <path d="M266 305V177L326 164V204L286 213V305Z" fill="url(#note)" stroke="url(#note)" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="245" cy="316" rx="43" ry="31" transform="rotate(-22 245 316)" fill="url(#note)"/>
</svg>
